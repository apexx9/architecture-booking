<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Renove — open graph card source</title>
    <!--
      Source for `app/opengraph-image.png`. Rendered by `brand/generate-icons.mjs`
      at 1200x630. Kept as HTML rather than a single SVG so the wordmark can use
      the same font stack and superscript mark as `components/ui/logo.tsx`.
    -->
    <style>
      @font-face {
        font-family: "Satoshi";
        src: url("../public/fonts/satoshi/Satoshi-Regular.otf")
          format("opentype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Satoshi";
        src: url("../public/fonts/satoshi/Satoshi-Medium.otf")
          format("opentype");
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: "Satoshi";
        src: url("../public/fonts/satoshi/Satoshi-Bold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      body {
        font-family: "Satoshi", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 1200px;
        height: 630px;
        padding: 72px 88px;
        background: #fff;
      }

      .mark {
        width: 80px;
        height: 80px;
      }

      .wordmark {
        font-size: 128px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.035em;
        color: #191919;
      }

      .wordmark sup {
        font-size: 0.4em;
        vertical-align: super;
      }

      .tagline {
        margin-top: 26px;
        font-size: 33px;
        font-weight: 400;
        line-height: 1.35;
        letter-spacing: -0.01em;
        color: #525252;
      }

      .rule {
        height: 1px;
        background: #e5e5e3;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        margin-top: 22px;
        font-size: 23px;
        font-weight: 400;
        line-height: 1.4;
        color: #6b6b6b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 64 64"
          width="80"
          height="80"
          role="img"
          aria-label="Renove"
        >
          <rect width="64" height="64" rx="12" fill="#191919" />
          <path fill="#fff" d="M19 47V30.5a13 13 0 0 1 26 0V47z" />
          <path fill="#191919" d="M29.5 47V36.5a2.5 2.5 0 0 1 5 0V47z" />
        </svg>
      </div>

      <div>
        <p class="wordmark">Renove<sup>&reg;</sup></p>
        <p class="tagline">
          The operating system for<br />architecture and interior design
          practices
        </p>
      </div>

      <div>
        <div class="rule"></div>
        <div class="meta">
          <span>hello@renove.africa</span>
          <span>renove.africa</span>
        </div>
      </div>
    </div>
  </body>
</html>
